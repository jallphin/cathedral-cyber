<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="3.75in" height="2.25in" viewBox="0 0 1125 675">
  <!-- 3.5x2 card + 0.125in bleed. 300 DPI canvas: 1125 x 675 px -->

  <!-- Background -->
  <rect x="0" y="0" width="1125" height="675" fill="#070809"/>

  <!-- Thin gold frame -->
  <rect x="57" y="52" width="1011" height="571" fill="none" stroke="#a48b4e" stroke-width="1.5"/>

  <!-- Icon mark top center -->
  <image x="497.5" y="72" width="130" height="130" xlink:href="../public/assets/images/icon.png"/>

  <!-- Name -->
  <text x="562.5" y="275" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="48" font-weight="500" letter-spacing="2" fill="#e8eaed">James Allphin</text>

  <!-- Title -->
  <text x="562.5" y="330" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" letter-spacing="3" fill="#98a0a8">Founder &amp; Lead Operator</text>

  <!-- Separator -->
  <line x1="430" y1="365" x2="695" y2="365" stroke="#a48b4e" stroke-width="1"/>

  <!-- Certs -->
  <text x="562.5" y="410" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="2" fill="#a48b4e">OSCP  ·  TS/SCI Eligible  ·  SDVOSB</text>

  <!-- Contact -->
  <text x="562.5" y="490" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" letter-spacing="1" fill="#e8eaed">contact@cathedralcyber.com</text>
  <text x="562.5" y="535" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="2" fill="#98a0a8">cathedralcyber.com</text>
</svg>