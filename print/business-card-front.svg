<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="3.75in" height="2.25in" viewBox="0 0 1125 675">
  <!-- 3.5x2 card + 0.125in bleed. 300 DPI canvas: 1125 x 675 px -->

  <!-- Background -->
  <rect x="0" y="0" width="1125" height="675" fill="#070809"/>

  <!-- Thin gold frame inset from bleed -->
  <rect x="57" y="52" width="1011" height="571" fill="none" stroke="#a48b4e" stroke-width="1.5"/>

  <!-- Wordmark logo centered -->
  <image x="180" y="160" width="765" height="240" xlink:href="assets/wordmark.png"/>

  <!-- Tagline -->
  <text x="562.5" y="445" text-anchor="middle" font-family="'Inter', 'Space Grotesk', sans-serif" font-size="22" letter-spacing="4" fill="#98a0a8">ENGINEERED LIKE STONE. OPERATED LIKE A RED TEAM.</text>

  <!-- Thin separator -->
  <line x1="380" y1="485" x2="745" y2="485" stroke="#a48b4e" stroke-width="1"/>

  <!-- Website -->
  <text x="562.5" y="540" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="3" fill="#e8eaed">cathedralcyber.com</text>
</svg>